<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faraday Duo">
<meta name="theme-color" content="#0a1114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Faraday Duo</title>
<style>
/* Due colonne, una per oscillatore. Sinistro ciano, destro corallo. Slider alti 64px con pomello da 60px. */
:root{--bg:#0a1114;--fg:#e6f0f2;--mut:#8fa6ac;--pan:#121c20;--line:#27383e;--a:#5cc8e8;--b:#ff8c66;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
 padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1;letter-spacing:.02em}
#st{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:700;color:var(--fg);background:var(--pan);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:0 18px;touch-action:manipulation}
#go.on{background:var(--fg);color:var(--bg)}
#stop{border-color:#8a3b3b;color:#ffb4b4}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(150px,27%) 1fr;grid-template-areas:"v v" "a b";gap:12px}
#cA{grid-area:a}#cB{grid-area:b}
.vis{grid-area:v;display:flex;gap:12px;min-height:0;min-width:0}
.cv{flex:1;min-width:0;position:relative;background:var(--pan);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv .ov{position:absolute;left:10px;top:6px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
@media (min-width:1100px){main{grid-template-columns:1fr 1.15fr 1fr;grid-template-rows:1fr;grid-template-areas:"a v b"}.vis{flex-direction:column}}
.ch{--c:var(--a);background:var(--pan);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;justify-content:space-around;gap:6px;min-height:0;min-width:0}
.ch.b{--c:var(--b)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h2{margin:0;font-size:22px;color:var(--c)}
.mute{min-height:48px;min-width:110px;border-color:var(--c)}
.mute.m{background:transparent;color:var(--mut);border-color:var(--line)}
.row{display:flex;flex-direction:column;gap:2px}
.lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.val{font-size:32px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.val small{font-size:15px;color:var(--mut);font-weight:500;margin-left:4px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl button{min-width:56px;min-height:56px;padding:0;font-size:26px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:64px;background:transparent;margin:0;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:22px;border-radius:11px;background:#1e2d33;border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:60px;height:60px;margin-top:-20px;border-radius:50%;background:var(--c);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
input[type=range]::-moz-range-track{height:22px;border-radius:11px;background:#1e2d33;border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{width:50px;height:50px;border-radius:50%;background:var(--c);border:5px solid var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--c,var(--a));outline-offset:2px}
@media (max-width:700px){main{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"v" "a" "b";overflow:auto}.vis{height:200px}.ch{flex:none;gap:10px}html,body{overflow:auto}}
</style>
</head>
<body>
<header>
  <h1>Faraday Duo</h1>
  <span id="st">fermo</span>
  <button id="go" type="button">Avvia audio</button>
  <button id="stop" type="button">Muta tutto</button>
</header>
<main id="m">
  <div class="vis">
    <div class="cv"><canvas id="scope"></canvas><span class="ov">Oscilloscopio</span></div>
    <div class="cv"><canvas id="lis"></canvas><span class="ov" id="rt">Lissajous</span></div>
  </div>
</main>
<script>
(()=>{
'use strict';
const FMIN=10,FMAX=150,AMAX=-12,AMIN=-60;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lin=db=>db<=AMIN+0.1?0:Math.pow(10,db/20);
const S=[{f:40,a:-24,ph:0,mute:true},{f:60,a:-24,ph:0,mute:true}];
let ctx=null,master=null,eng=null,on=false;
const TCF=0.03,TCG=0.035,NUDGE=0.1,CAP=lin(AMAX);

/* ---- audio ----
   Motore principale: AudioWorklet. Tutto avviene sul thread audio: accumulatore di fase in double,
   frequenza, ampiezza e fase lisciate per campione. Nessun nodo viene creato durante l'uso.
   Il corpo della funzione e' anche il sorgente del worklet (viene serializzato in un Blob). */
function workletBody(){
  class FD extends AudioWorkletProcessor{
    constructor(){
      super();
      const mk=()=>({ph:0,f:40,tf:40,a:0,ta:0,o:0,to:0});
      this.v=[mk(),mk()];
      const c=t=>1-Math.exp(-1/(t*sampleRate));
      this.kf=c(0.03);this.ka=c(0.035);this.ko=c(0.04);
      this.port.onmessage=e=>{
        const m=e.data,v=this.v[m.i];
        if(!v||!isFinite(m.f)||!isFinite(m.a)||!isFinite(m.ph))return;
        v.tf=Math.min(150,Math.max(10,m.f));
        v.ta=Math.min(m.cap,Math.max(0,m.a));
        v.to=m.ph;
        if(m.snap){v.f=v.tf;v.o=v.to;}
      };
    }
    process(inputs,outputs){
      const out=outputs[0],TP=2*Math.PI,sr=sampleRate;
      for(let c=0;c<2&&c<out.length;c++){
        const v=this.v[c],ch=out[c],n=ch.length;
        let ph=v.ph,f=v.f,a=v.a,o=v.o;
        const tf=v.tf,ta=v.ta,to=v.to,kf=this.kf,ka=this.ka,ko=this.ko;
        for(let k=0;k<n;k++){
          f+=(tf-f)*kf;
          a+=(ta-a)*ka;
          let d=to-o;d-=Math.round(d);
          o+=d*ko;
          ph+=f/sr;ph-=Math.floor(ph);
          ch[k]=a*Math.sin(TP*(ph+o));
        }
        if(ta===0&&a<1e-7)a=0;
        o-=Math.floor(o);
        v.ph=ph;v.f=f;v.a=a;v.o=o;
      }
      return true;
    }
  }
  registerProcessor('fd',FD);
}
async function makeWorklet(){
  const url=URL.createObjectURL(new Blob(['('+workletBody+')()'],{type:'application/javascript'}));
  try{await ctx.audioWorklet.addModule(url);}finally{URL.revokeObjectURL(url);}
  const node=new AudioWorkletNode(ctx,'fd',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
  node.connect(master);
  return {kind:'worklet',push(i,snap){
    const s=S[i];
    node.port.postMessage({i,f:s.f,a:s.mute?0:lin(Math.min(s.a,AMAX)),ph:s.ph/360,cap:CAP,snap:!!snap});
  }};
}
/* Ripiego se AudioWorklet non c'e': oscillatori nativi, fase con piccolo spostamento di frequenza. */
function makeNative(){
  const mg=ctx.createChannelMerger(2);mg.connect(master);
  const t0=ctx.currentTime+0.05;
  const V=[0,1].map(i=>{
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=S[i].f;
    const g=ctx.createGain();g.gain.value=0;o.connect(g);g.connect(mg,0,i);o.start(t0);
    return {o,g,off:0};
  });
  return {kind:'native',push(i){
    const v=V[i],s=S[i],t=ctx.currentTime;
    v.o.frequency.setTargetAtTime(s.f,t,TCF);
    v.g.gain.setTargetAtTime(s.mute?0:lin(Math.min(s.a,AMAX)),t,TCG);
    const tg=s.ph/360;let d=tg-v.off;d-=Math.round(d);
    if(Math.abs(d)>1e-6){
      const cs=ctx.createConstantSource(),gn=ctx.createGain(),N=64,cv=new Float32Array(N);
      for(let k=0;k<N;k++)cv[k]=(0.5-0.5*Math.cos(2*Math.PI*k/(N-1)))*2*d/NUDGE;
      gn.gain.value=0;cs.connect(gn);gn.connect(v.o.frequency);
      gn.gain.setValueCurveAtTime(cv,t,NUDGE);
      cs.start(t);cs.stop(t+NUDGE+0.02);cs.onended=()=>{try{cs.disconnect();gn.disconnect();}catch(e){}};
      v.off=tg;
    }
  }};
}
function push(i,snap){if(eng)eng.push(i,snap);}
let starting=false;
async function start(){
  if(starting)return;
  starting=true;
  try{
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
      ctx=new AC({latencyHint:'playback'});
      master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    }
    const rp=ctx.resume(); /* subito, dentro il gesto dell'utente */
    if(!eng){
      try{eng=await makeWorklet();}catch(e){eng=makeNative();}
      push(0,true);push(1,true);
    }
    await rp;
    on=true;master.gain.setTargetAtTime(1,ctx.currentTime,0.08);
    push(0);push(1);
  }catch(e){$('#st').textContent='audio non disponibile';starting=false;return;}
  starting=false;
  ui();
}
function muteAll(){S[0].mute=S[1].mute=true;push(0);push(1);ui();}

/* ---- interfaccia ---- */
const rows=[
 {k:'f',lab:'Frequenza',min:FMIN,max:FMAX,step:0.1,dec:1,unit:'Hz',fine:true},
 {k:'a',lab:'Ampiezza',min:AMIN,max:AMAX,step:0.5,dec:1,unit:'dB',fine:true,fs:0.5},
 {k:'ph',lab:'Fase',min:0,max:360,step:1,dec:0,unit:'°',fine:true,fs:1}
];
const els=[];
function build(){
  const m=$('#m');
  [0,1].forEach(i=>{
    const c=document.createElement('section');c.className='ch'+(i?' b':'');c.id=i?'cB':'cA';
    const hd=document.createElement('div');hd.className='hd';
    hd.innerHTML='<h2>'+(i?'Destro · B':'Sinistro · A')+'</h2>';
    const mb=document.createElement('button');mb.type='button';mb.className='mute';
    mb.onclick=()=>{S[i].mute=!S[i].mute;push(i);ui(i);};
    hd.append(mb);c.append(hd);
    const e={mb,r:{}};
    rows.forEach(r=>{
      const row=document.createElement('div');row.className='row';
      const lab=document.createElement('div');lab.className='lab';
      const val=document.createElement('span');val.className='val';
      lab.append(r.lab,val);
      const ctl=document.createElement('div');ctl.className='ctl';
      const sl=document.createElement('input');sl.type='range';sl.min=r.min;sl.max=r.max;sl.step='any';
      sl.setAttribute('aria-label',r.lab+(i?' B':' A'));
      sl.oninput=()=>{set(i,r,parseFloat(sl.value));};
      if(r.fine){
        const st=r.fs||0.1;
        const mk=(t,sg)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-label',(sg<0?'Diminuisci ':'Aumenta ')+r.lab);b.onclick=()=>set(i,r,S[i][r.k]+sg*st);return b;};
        ctl.append(mk('−',-1),sl,mk('+',1));
      }else ctl.append(sl);
      row.append(lab,ctl);c.append(row);
      e.r[r.k]={sl,val};
    });
    m.append(c);els.push(e);
  });
}
function set(i,r,v){
  v=clamp(v,r.min,r.max);
  S[i][r.k]=v;
  push(i);ui(i);
}
function ui(only){
  want();
  $('#go').textContent=on?'Audio attivo':'Avvia audio';
  $('#go').classList.toggle('on',on);
  $('#st').textContent=on?'attivo':'fermo · parte in silenzio';
  [0,1].forEach(i=>{
    if(only!==undefined&&only!==i)return;
    const e=els[i],s=S[i];
    e.mb.textContent=s.mute?'Muto':'Suona';
    e.mb.classList.toggle('m',s.mute);
    rows.forEach(r=>{
      const x=e.r[r.k];
      if(Math.abs(parseFloat(x.sl.value)-s[r.k])>1e-6)x.sl.value=s[r.k];
      const h=s[r.k].toFixed(r.dec).replace('-','−')+'<small>'+r.unit+'</small>';
      if(x.h!==h){x.h=h;x.val.innerHTML=h;}
    });
  });
}
/* ---- visualizzatore: disegnato dai parametri, nessun legame con l'audio ---- */
const cvS=$('#scope'),cvL=$('#lis'),gS=cvS.getContext('2d'),gL=cvL.getContext('2d');
const COL=['#5cc8e8','#ff8c66'];
let need=false,dragging=false,lastDraw=0;const DRAG_MS=66;
const amp=i=>Math.min(1,lin(Math.min(S[i].a,AMAX))/lin(AMAX));
function fit(cv){const d=Math.min(window.devicePixelRatio||1,2),w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}}
function rat(x){for(let d=1;d<=16;d++){const n=Math.round(x*d);if(n>=1&&Math.abs(n/d-x)<=0.002*x)return [n,d];}return null;}
function draw(ts){
  if(dragging&&ts-lastDraw<DRAG_MS){requestAnimationFrame(draw);return;}
  need=false;lastDraw=ts;fit(cvS);fit(cvL);
  let W=cvS.width,H=cvS.height;gS.clearRect(0,0,W,H);
  gS.strokeStyle='#27383e';gS.lineWidth=1;gS.beginPath();gS.moveTo(0,H/2);gS.lineTo(W,H/2);gS.stroke();
  const win=3/Math.min(S[0].f,S[1].f);
  for(let i=0;i<2;i++){
    const s=S[i],a=amp(i);
    gS.globalAlpha=s.mute?0.25:1;gS.strokeStyle=COL[i];gS.lineWidth=2.5;gS.beginPath();
    for(let x=0;x<=W;x+=2){const t=x/W*win,y=H/2-Math.sin(2*Math.PI*(s.f*t+s.ph/360))*a*H*0.42;x?gS.lineTo(x,y):gS.moveTo(x,y);}
    gS.stroke();
  }
  gS.globalAlpha=1;
  W=cvL.width;H=cvL.height;gL.clearRect(0,0,W,H);
  gL.strokeStyle='#27383e';gL.lineWidth=1;gL.beginPath();gL.moveTo(0,H/2);gL.lineTo(W,H/2);gL.moveTo(W/2,0);gL.lineTo(W/2,H);gL.stroke();
  const r=rat(S[1].f/S[0].f),T=r?r[1]/S[0].f:3/S[0].f,sc=Math.min(W,H)*0.42,ax=amp(0),ay=amp(1);
  gL.globalAlpha=(S[0].mute||S[1].mute)?0.3:1;gL.strokeStyle='#e6f0f2';gL.lineWidth=2;gL.beginPath();
  const NP=dragging?500:1600;
  for(let k=0;k<=NP;k++){const t=k/NP*T,x=W/2+Math.sin(2*Math.PI*(S[0].f*t+S[0].ph/360))*ax*sc,y=H/2-Math.sin(2*Math.PI*(S[1].f*t+S[1].ph/360))*ay*sc;k?gL.lineTo(x,y):gL.moveTo(x,y);}
  gL.stroke();gL.globalAlpha=1;
  $('#rt').textContent='Lissajous · B/A '+(r?r[0]+':'+r[1]:(S[1].f/S[0].f).toFixed(3));
}
const want=()=>{if(!need){need=true;requestAnimationFrame(draw);}};
window.addEventListener('resize',want);
/* durante il trascinamento il visualizzatore scende a ~15 fps con meno punti */
document.addEventListener('pointerdown',e=>{if(e.target&&e.target.type==='range')dragging=true;});
const endDrag=()=>{if(dragging){dragging=false;want();}};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
build();ui();want();
$('#go').onclick=start;
$('#stop').onclick=muteAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape')muteAll();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&on)ctx.resume();});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
})();
</script>
</body>
</html>
