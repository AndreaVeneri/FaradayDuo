<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faraday Duo">
<meta name="theme-color" content="#0a1114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Faraday Duo</title>
<style>
/* Due colonne, una per oscillatore. Sinistro ciano, destro corallo. Slider alti 64px con pomello da 60px. */
:root{--bg:#0a1114;--fg:#e6f0f2;--mut:#8fa6ac;--pan:#121c20;--line:#27383e;--a:#5cc8e8;--b:#ff8c66;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
 padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1;letter-spacing:.02em}
#st{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:700;color:var(--fg);background:var(--pan);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:0 18px;touch-action:manipulation}
#go.on{background:var(--fg);color:var(--bg)}
#stop{border-color:#8a3b3b;color:#ffb4b4}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{--c:var(--a);background:var(--pan);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;justify-content:space-around;gap:6px;min-height:0;min-width:0}
.ch.b{--c:var(--b)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h2{margin:0;font-size:22px;color:var(--c)}
.mute{min-height:48px;min-width:110px;border-color:var(--c)}
.mute.m{background:transparent;color:var(--mut);border-color:var(--line)}
.row{display:flex;flex-direction:column;gap:2px}
.lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.val{font-size:32px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.val small{font-size:15px;color:var(--mut);font-weight:500;margin-left:4px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl button{min-width:56px;min-height:56px;padding:0;font-size:26px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:64px;background:transparent;margin:0;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:22px;border-radius:11px;background:#1e2d33;border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:60px;height:60px;margin-top:-20px;border-radius:50%;background:var(--c);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
input[type=range]::-moz-range-track{height:22px;border-radius:11px;background:#1e2d33;border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{width:50px;height:50px;border-radius:50%;background:var(--c);border:5px solid var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--c,var(--a));outline-offset:2px}
@media (max-width:700px){main{grid-template-columns:1fr;overflow:auto}.ch{flex:none;gap:10px}html,body{overflow:auto}}
</style>
</head>
<body>
<header>
  <h1>Faraday Duo</h1>
  <span id="st">fermo</span>
  <button id="go" type="button">Avvia audio</button>
  <button id="stop" type="button">Muta tutto</button>
</header>
<main id="m"></main>
<script>
(()=>{
'use strict';
const FMIN=10,FMAX=150,AMAX=-12,AMIN=-60;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lin=db=>db<=AMIN+0.1?0:Math.pow(10,db/20);
const S=[{f:40,a:-24,ph:0,mute:true},{f:60,a:-24,ph:0,mute:true}];
let ctx=null,master=null,V=[],on=false;
const TCF=0.03,TCG=0.035,NUDGE=0.1;

/* ---- audio: oscillatori interni di Safari, fase con piccolo spostamento di frequenza ---- */
function init(){
  const AC=window.AudioContext||window.webkitAudioContext;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  ctx=new AC({latencyHint:'playback'});
  master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  const mg=ctx.createChannelMerger(2);mg.connect(master);
  const t0=ctx.currentTime+0.05;
  V=[0,1].map(i=>{
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=S[i].f;
    const g=ctx.createGain();g.gain.value=0;o.connect(g);g.connect(mg,0,i);o.start(t0);
    return {o,g,off:0};
  });
}
function push(i){
  if(!ctx)return;
  const v=V[i],s=S[i],t=ctx.currentTime;
  v.o.frequency.setTargetAtTime(s.f,t,TCF);
  v.g.gain.setTargetAtTime(s.mute?0:lin(Math.min(s.a,AMAX)),t,TCG);
  const tg=s.ph/360;let d=tg-v.off;d-=Math.round(d);
  if(Math.abs(d)>1e-6){
    const cs=ctx.createConstantSource();cs.offset.value=d/NUDGE;cs.connect(v.o.frequency);
    cs.start(t);cs.stop(t+NUDGE+0.02);cs.onended=()=>{try{cs.disconnect();}catch(e){}};
    v.off=tg;
  }
}
async function start(){
  try{
    if(!ctx)init();
    await ctx.resume();
    on=true;master.gain.setTargetAtTime(1,ctx.currentTime,0.08);
    push(0);push(1);
  }catch(e){$('#st').textContent='audio non disponibile';return;}
  ui();
}
function muteAll(){S[0].mute=S[1].mute=true;push(0);push(1);ui();}

/* ---- interfaccia ---- */
const rows=[
 {k:'f',lab:'Frequenza',min:FMIN,max:FMAX,step:0.1,dec:1,unit:'Hz',fine:true},
 {k:'a',lab:'Ampiezza',min:AMIN,max:AMAX,step:0.5,dec:1,unit:'dB',fine:true,fs:0.5},
 {k:'ph',lab:'Fase',min:0,max:360,step:1,dec:0,unit:'°',fine:true,fs:1}
];
const els=[];
function build(){
  const m=$('#m');
  [0,1].forEach(i=>{
    const c=document.createElement('section');c.className='ch'+(i?' b':'');
    const hd=document.createElement('div');hd.className='hd';
    hd.innerHTML='<h2>'+(i?'Destro · B':'Sinistro · A')+'</h2>';
    const mb=document.createElement('button');mb.type='button';mb.className='mute';
    mb.onclick=()=>{S[i].mute=!S[i].mute;push(i);ui();};
    hd.append(mb);c.append(hd);
    const e={mb,r:{}};
    rows.forEach(r=>{
      const row=document.createElement('div');row.className='row';
      const lab=document.createElement('div');lab.className='lab';
      const val=document.createElement('span');val.className='val';
      lab.append(r.lab,val);
      const ctl=document.createElement('div');ctl.className='ctl';
      const sl=document.createElement('input');sl.type='range';sl.min=r.min;sl.max=r.max;sl.step='any';
      sl.setAttribute('aria-label',r.lab+(i?' B':' A'));
      sl.oninput=()=>{set(i,r,parseFloat(sl.value));};
      if(r.fine){
        const st=r.fs||0.1;
        const mk=(t,sg)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-label',(sg<0?'Diminuisci ':'Aumenta ')+r.lab);b.onclick=()=>set(i,r,S[i][r.k]+sg*st);return b;};
        ctl.append(mk('−',-1),sl,mk('+',1));
      }else ctl.append(sl);
      row.append(lab,ctl);c.append(row);
      e.r[r.k]={sl,val};
    });
    m.append(c);els.push(e);
  });
}
function set(i,r,v){
  v=clamp(v,r.min,r.max);
  S[i][r.k]=v;
  push(i);ui();
}
function ui(){
  $('#go').textContent=on?'Audio attivo':'Avvia audio';
  $('#go').classList.toggle('on',on);
  $('#st').textContent=on?'attivo':'fermo · parte in silenzio';
  [0,1].forEach(i=>{
    const e=els[i],s=S[i];
    e.mb.textContent=s.mute?'Muto':'Suona';
    e.mb.classList.toggle('m',s.mute);
    rows.forEach(r=>{
      const x=e.r[r.k];
      if(Math.abs(parseFloat(x.sl.value)-s[r.k])>1e-6)x.sl.value=s[r.k];
      x.val.innerHTML=s[r.k].toFixed(r.dec).replace('-','−')+'<small>'+r.unit+'</small>';
    });
  });
}
build();ui();
$('#go').onclick=start;
$('#stop').onclick=muteAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape')muteAll();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&on)ctx.resume();});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
})();
</script>
</body>
</html>
